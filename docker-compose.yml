# 로컬 실행: cp .env.example .env 후 DB_PASSWORD를 설정하고 docker compose up --build
# 앱 http://localhost:8080, PostgreSQL localhost:5432
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: contractcheck
      POSTGRES_USER: contractcheck
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractcheck -d contractcheck"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/contractcheck
      DB_USERNAME: contractcheck
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}

volumes:
  pgdata:
