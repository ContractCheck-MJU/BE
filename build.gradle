plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ac.mju'
version = '0.0.1-SNAPSHOT'
description = 'contractcheck'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'software.amazon.awssdk:s3'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.jetbrains:annotations:26.0.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.navercorp.fixturemonkey:fixture-monkey-starter:1.2.3'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// AWS SDK v2는 Boot BOM이 관리하지 않아 BOM을 가져온다. SeaweedFS(S3 호환)에 endpointOverride로 연결한다.
dependencyManagement {
    imports {
        mavenBom 'software.amazon.awssdk:bom:2.31.30'
    }
}

// 실제 SeaweedFS가 필요한 통합 테스트(@Tag("storage"))는 test와 CI에서 제외하고 storageTest로만 돌린다.
// 먼저 docker compose up -d seaweedfs seaweedfs-init 으로 저장소를 띄운다. 접속 키는 .env의 STORAGE_* 만 넘긴다.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'storage'
    }
}

tasks.register('storageTest', Test) {
    description = '실제 SeaweedFS(S3 호환)를 쓰는 통합 테스트를 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'storage'
    }
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def m = line =~ /^(STORAGE_(?:ENDPOINT|REGION|BUCKET|ACCESS_KEY|SECRET_KEY))=(.*)$/
            if (m.matches() && !System.getenv(m[0][1])) {
                environment m[0][1], m[0][2]
            }
        }
    }
}
