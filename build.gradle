plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ac.mju'
version = '0.0.1-SNAPSHOT'
description = 'contractcheck'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'software.amazon.awssdk:s3'
    // RAG(EmbeddingModel·DocumentRetriever). 스타터는 쓰지 않아 자동 설정·키 요구가 없다. VectorStore 테이블은 쓰지 않는다.
    implementation 'org.springframework.ai:spring-ai-rag'
    // Claude 호출(FR-EXP). LlmClient 구현체(AnthropicLlmClient)에서만 쓴다.
    implementation 'com.anthropic:anthropic-java:3.3.0'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.jetbrains:annotations:26.0.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.navercorp.fixturemonkey:fixture-monkey-starter:1.2.3'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// AWS SDK v2와 Spring AI는 Boot BOM이 관리하지 않아 BOM을 가져온다. SeaweedFS(S3 호환)에 endpointOverride로 연결한다.
dependencyManagement {
    imports {
        mavenBom 'software.amazon.awssdk:bom:2.31.30'
        mavenBom 'org.springframework.ai:spring-ai-bom:2.1.0'
    }
}

// 실제 외부 서버가 필요한 통합 테스트는 test와 CI에서 제외하고 전용 태스크로만 돌린다. 접속 정보는 .env의 해당 키만 넘긴다(이미 환경변수면 그 값을 쓴다).
//  - storageTest  (@Tag("storage"))   : docker compose up -d seaweedfs seaweedfs-init
//  - inferenceTest(@Tag("inference")) : 추론 서버(DATA의 api.mock_inference, 8000번)와 로컬 Postgres(근거 데이터는 scripts/ingest.sh로 적재)
//  - postgresTest (@Tag("postgres"))  : 로컬 Postgres에 임시 스키마를 만들어 Flyway 마이그레이션 동작을 확인(docker compose up -d postgres)
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'storage', 'inference', 'postgres'
    }
}

def envFromDotenv = { Test task, String pattern ->
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def m = line =~ pattern
            if (m.matches() && !System.getenv(m[0][1])) {
                task.environment m[0][1], m[0][2]
            }
        }
    }
}

tasks.register('storageTest', Test) {
    description = '실제 SeaweedFS(S3 호환)를 쓰는 통합 테스트를 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'storage'
    }
    envFromDotenv(it, /^(STORAGE_(?:ENDPOINT|REGION|BUCKET|ACCESS_KEY|SECRET_KEY))=(.*)$/)
}

tasks.register('inferenceTest', Test) {
    description = '실제 추론 서버(FastAPI)와 로컬 Postgres(pgvector)를 쓰는 통합 테스트를 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'inference'
    }
    envFromDotenv(it, /^((?:INFERENCE_(?:BASE_URL|API_KEY))|(?:DB_(?:URL|USERNAME|PASSWORD)))=(.*)$/)
}

tasks.register('postgresTest', Test) {
    description = '로컬 Postgres에서 Flyway 마이그레이션(FK 삭제 규칙 등)을 확인한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'postgres'
    }
    envFromDotenv(it, /^(DB_(?:URL|USERNAME|PASSWORD))=(.*)$/)
}
