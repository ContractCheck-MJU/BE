# 배포: cp .env.example .env 후 DB_PASSWORD를 설정하고
# docker compose -f docker-compose.prod.yml up -d --build
# PostgreSQL 포트는 호스트에 열지 않는다. 앱만 8080.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: contractcheck
      POSTGRES_USER: contractcheck
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractcheck -d contractcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/contractcheck
      DB_USERNAME: contractcheck
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      LOG_PATH: /var/log/contractcheck
    volumes:
      - ./logs:/var/log/contractcheck
    restart: unless-stopped

volumes:
  pgdata:
