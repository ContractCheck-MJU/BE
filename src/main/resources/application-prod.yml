# prod: application.yml 의 PostgreSQL(DB_URL, DB_USERNAME, DB_PASSWORD)을 그대로 쓴다.
# 배포 환경에서 세 변수를 반드시 주입한다.
# 파일 ECS JSON·Tomcat 액세스 로그는 application.yml 의 dev|prod 문서를 쓴다.
# 콘솔도 ECS JSON이다. dev 콘솔은 패턴이다.
spring:
  config:
    activate:
      on-profile: prod

logging:
  structured:
    format:
      console: ecs
  level:
    root: warn
    ac.mju.contractcheck: info

# 운영은 Linux라 Apple Vision을 쓸 수 없다. Upstage 구현체가 생기기 전에는 OCR 빈이 없다.
# TODO(FR-UPL-02): UpstageOcrClient 구현 후 OCR을 쓰는 서비스를 붙인다.
contractcheck:
  ocr:
    provider: ${OCR_PROVIDER:upstage}

# 운영에서는 Swagger UI·API 문서 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
