spring:
  application:
    name: contractcheck
  profiles:
    default: local
  # local / dev / prod 모두 같은 PostgreSQL. 접속 정보는 환경변수로만 주입한다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contractcheck}
    username: ${DB_USERNAME:contractcheck}
    password: ${DB_PASSWORD:}
  # DDL 담당을 나눈다.
  # - flyway: 스펙시트 애플리케이션 테이블. 기동 시 db/migration 적용.
  # - session.jdbc.initialize-schema: spring_session, spring_session_attributes.
  #   기본값 embedded 는 H2 등 내장 DB 에서만 실행되므로 PostgreSQL 에서는 always.
  # - jpa.hibernate.ddl-auto: 엔티티와 테이블 불일치만 검사. 테이블은 만들지 않는다.
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: always
      # 공식 스크립트는 CREATE TABLE 이라 재기동마다 이미 있으면 실패한다. 그 오류는 무시한다.
      continue-on-error: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # FR-UPL-01 업로드 한도. 정확히 20MB는 통과하고 그보다 크면 413(FILE_TOO_LARGE)이다.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  # FR-AUTH-01 소셜 로그인. 시크릿은 환경변수로만 주입한다. 값이 없으면 로그인만 실패하고 기동은 된다.
  # 콜백은 {baseUrl}/login/oauth2/code/{registrationId}. 제공자 콘솔에 이 주소를 등록한다.
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:unset}
            client-secret: ${KAKAO_CLIENT_SECRET:unset}
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # account_email은 비즈 앱 전환 전까지 권한이 없어 요청하면 KOE205로 실패한다. 이메일 없이 로그인한다.
            scope: profile_nickname
          naver:
            client-id: ${NAVER_CLIENT_ID:unset}
            client-secret: ${NAVER_CLIENT_SECRET:unset}
            client-name: Naver
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name,email
          google:
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            # openid를 빼서 OIDC가 아닌 일반 OAuth2 흐름(CustomOAuth2UserService)으로 처리한다.
            scope: profile,email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  # nginx 리버스 프록시 뒤에서 {baseUrl}이 https 기준 콜백 주소가 되도록 X-Forwarded-* 를 따른다.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m   # FR-AUTH-02: 유휴 30분 후 만료(제안)

contractcheck:
  # 계약서 원본 보관소(S3 호환, SeaweedFS). 접속 정보는 환경변수로만 주입하고 값이 없으면 업로드만 실패한다.
  # 버킷은 미리 만들어 둔다. 서버 측 암호화(SSE-S3)를 지원하지 않는 저장소면 STORAGE_SSE=false로 끈다.
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:contractcheck}
    access-key: ${STORAGE_ACCESS_KEY:unset}
    secret-key: ${STORAGE_SECRET_KEY:unset}
    path-style: true
    server-side-encryption: ${STORAGE_SSE:true}
  # OCR 구현체(FR-UPL-02). apple-vision은 macOS 로컬 시연용이고, 운영은 upstage(구현 예정)로 바꾼다. 구현체 추가·교체 방법은 OcrClient를 본다.
  # 첫 Apple Vision 인식은 모델을 불러오느라 수십 초 걸릴 수 있어 제한 시간을 넉넉히 둔다.
  ocr:
    provider: ${OCR_PROVIDER:apple-vision}
    timeout: ${OCR_TIMEOUT:120s}
  # Python 추론 서버(FastAPI, 내부망). POST /classify, /embed. 키(X-Internal-Api-Key)는 환경변수로만 주입한다.
  # 타임아웃 10초·배치 64는 스펙시트 값이고, 재시도 횟수(총 3회)는 스펙에 없어 제안값이다. 서킷브레이커는 아직 없다(NFR-03).
  inference:
    base-url: ${INFERENCE_BASE_URL:http://localhost:8000}
    api-key: ${INFERENCE_API_KEY:unset}
    timeout: 10s
    max-attempts: 3
    retry-backoff: 200ms
    batch-size: 64
  # Claude(쉬운말 설명·수정 문구, FR-EXP). 키는 환경변수로만 주입하고, 없으면 앱은 뜨지만 설명 생성만 503이다.
  # 응답 목표 10초(TC-EXP-013)라 effort는 low, SDK 재시도는 1회(시간 초과 포함)다.
  llm:
    api-key: ${ANTHROPIC_API_KEY:unset}
    model: ${LLM_MODEL:claude-sonnet-5-5}
    effort: ${LLM_EFFORT:low}
    timeout: ${LLM_TIMEOUT:10s}
    max-retries: 1
    max-tokens: 4096
  # 토스페이먼츠 서버 연동(FR-PAY-02). 시크릿 키(테스트는 test_sk로 시작)는 환경변수로만 주입한다. 비어 있으면 토스 클라이언트가 등록되지 않아
  # 결제 승인이 502 PAYMENT_GATEWAY_ERROR로 거절되고 앱은 정상 기동한다. timeout은 스펙에 없어 제안값이다.
  toss:
    base-url: https://api.tosspayments.com
    secret-key: ${TOSS_SECRET_KEY:}
    timeout: 15s
  session:
    cookie-secure: true   # SESSION 쿠키 Secure. local 프로필만 http 개발을 위해 끈다. 나머지 속성은 SessionConfig
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}   # 소셜 로그인 성공·실패 리다이렉트 기준
  analysis:
    confidence-threshold: 0.6       # TC-ANL-017
    evidence-score-threshold: 0.5   # AI·RAG 파이프라인 7단계 리랭크 임계
  comparison:
    match-threshold: 0.6            # FR-CMP-01 조항 짝 맞추기 유사도 임계(이 값 미만은 ADDED·DELETED)

# Actuator: health·info만 웹에 노출
management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# dev·prod 공통 로그: 파일은 ECS JSON, LOG_PATH 아래 롤링.
# dev 콘솔 패턴은 application-dev.yml, prod 콘솔 ECS는 application-prod.yml.
# local·test는 이 문서를 쓰지 않는다(콘솔만, 패턴은 각 프로필).
spring:
  config:
    activate:
      on-profile: "dev | prod"

logging:
  file:
    path: ${LOG_PATH:./logs}
    name: ${LOG_PATH:./logs}/contractcheck.log
  structured:
    format:
      file: ecs
    json:
      context:
        include: true
    ecs:
      service:
        environment: ${spring.profiles.active:}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

server:
  # nginx 등 프록시 뒤에서 X-Forwarded-Proto/Host 를 반영한다.
  # 없으면 Swagger(OpenAPI) 서버 주소가 http 로 생성돼 https 페이지에서 요청이 막힌다.
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: true
      directory: ${LOG_PATH:./logs}/access
      prefix: access
      suffix: .log
      file-date-format: .yyyy-MM-dd
      rotate: true
      rename-on-rotate: true
      buffered: false
      max-days: 30
      # 쿼리스트링은 토큰이 실릴 수 있어 제외한다. %D는 처리 ms, 요청 ID는 헤더.
      pattern: '%h %l %u %t "%m %U" %s %b %D %{X-Request-Id}o'

