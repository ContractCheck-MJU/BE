# 개인정보 마스킹 규칙 (FR-UPL-04). 외부 서비스(추론 서버·Claude)로 나가는 텍스트와 contracts.masked_text에 적용한다.
#
# 관리 방법
# - 정규식은 이 파일에서만 고친다. 코드를 바꾸거나 다시 빌드하지 않고 contractcheck.masking.rules-location 으로
#   다른 파일(예: file:/etc/contractcheck/pii-rules.yml)을 가리켜도 된다.
# - 위에서 아래로 순서대로 적용한다. 앞 규칙이 치환한 토큰에는 숫자가 없으므로 뒤 규칙과 겹치지 않는다.
#   예: 전화번호(010-1234-5678)를 계좌번호 규칙보다 먼저 두어야 계좌번호로 잘못 치환되지 않는다.
# - 정규식은 YAML 작은따옴표('...')로 감싼다. 역슬래시를 그대로 쓸 수 있다. 작은따옴표 자체는 ''로 쓴다.
# - 잘못된 정규식·누락된 항목·겹치는 id는 앱 시작 단계에서 실패한다(마스킹이 조용히 빠지는 일을 막는다).
#
# 항목
# - id: 규칙 이름(겹치면 안 된다). 로그에 규칙별 치환 건수만 남기며 원문은 남기지 않는다.
# - description: 무엇을 가리는 규칙인지.
# - pattern: 자바 정규식. 앞 문맥은 남기고 값만 치환하려면 앞 문맥을 그룹 ( )으로 묶는다.
# - replacement: 치환 문자. 그룹은 $1처럼 참조한다.
# - verify: true면 마스킹이 끝난 텍스트에 이 패턴이 다시 보이는지 검사해, 남아 있으면 외부 전송을 막는다(실패로 처리).
#
# 스펙 미정: [이름]·[주소]는 TC-UPL-014에서 확정된 치환 문자이고, 나머지 토큰은 스펙에 "마스킹 토큰"이라고만 있어 임시다.
# 이름·주소는 정규식·규칙 기반이라 완벽하지 않다(아래 각 규칙의 한계를 본다). 번호류(주민번호·전화번호)는 verify로 한 번 더 막는다.

rules:
  - id: resident-registration-number
    description: '주민등록번호·외국인등록번호 (생년월일 6자리 + 성별 1~8 + 6자리)'
    pattern: '(?<![\d-])\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])[-\s]?[1-8]\d{6}(?!\d)'
    replacement: '[주민번호]'
    verify: true

  - id: phone-number
    description: '휴대전화·지역번호 전화번호 (010-1234-5678, 02-123-4567, 031-123-4567 등)'
    pattern: '(?<![\d-])(?:01[016-9]|02|0[3-6]\d|070|080)[-.\s]?\d{3,4}[-.\s]?\d{4}(?!\d)'
    replacement: '[전화번호]'
    verify: true

  - id: bank-account-labeled
    description: '은행·계좌 표시 뒤에 오는 숫자 (하이픈 없는 계좌번호 포함). 표시가 없는 연속 숫자는 보증금 등과 구분할 수 없어 건드리지 않는다.'
    pattern: '((?:계좌번호|계좌|은행|농협|신협|우체국|새마을금고|뱅크)\s*[:：]?\s*)\d{9,16}(?!\d)'
    replacement: '$1[계좌번호]'

  - id: bank-account
    description: '하이픈으로 나뉜 계좌번호 (숫자 합계 10~16자리). 날짜(2026-11-24)처럼 짧은 숫자 묶음은 제외한다.'
    pattern: '(?<![\d-])(?=(?:\d-?){10,16}(?!\d))\d{2,6}(?:-\d{2,7}){2,3}(?!\d)'
    replacement: '[계좌번호]'
    verify: true

  - id: person-name
    description: '호칭(임대인·임차인·대리인·중개인·계약자·성명 등) 바로 뒤의 한글 이름 2~4자. 한계: 호칭 없이 쓰인 이름은 가리지 못한다.'
    pattern: '(?m)((?:임대인|임차인|대리인|공인중개사|중개인|계약자|성명|이름)(?:\s*[(（][갑을][)）])?\s*[:：]?\s*)(?!(?:소유|본인|쌍방|각자|명의|및|또는|사이|대리|양측|주소|연락처|전화|계좌|서명|날인|책임|의무|부담|권리))[가-힣]{2,4}(?=\s*[(（,，.]|\s*씨|\s*(?:은|는|이|가|와|과|의)(?![가-힣])|[ \t]*$)'
    replacement: '$1[이름]'

  - id: address
    description: '도로명 주소 (시·도 + 시/군/구 + 로/길 + 번호, 동·호 상세 포함). 한계: 시·도로 시작하지 않는 주소는 가리지 못한다.'
    pattern: '(?:서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)(?:특별시|광역시|특별자치시|특별자치도|도|시)?\s*[가-힣0-9]+(?:시|군|구)(?:\s*[가-힣0-9]+(?:구|읍|면))?\s*[가-힣0-9]+(?:로|길)(?:\s*\d+번길)?\s*\d+(?:-\d+)?(?:\s*,?\s*(?:\d+동\s*)?\d+호)?(?:\s*\d+층)?'
    replacement: '[주소]'

  - id: address-lot
    description: '지번 주소 (시·도 + 시/군/구 + 동/리 + 번지, 동·호 상세 포함)'
    pattern: '(?:서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)(?:특별시|광역시|특별자치시|특별자치도|도|시)?\s*[가-힣0-9]+(?:시|군|구)(?:\s*[가-힣0-9]+(?:구|읍|면))?\s*[가-힣0-9]+(?:동|리)\s*\d+(?:-\d+)?(?:번지)?(?:\s*,?\s*(?:\d+동\s*)?\d+호)?'
    replacement: '[주소]'

  - id: address-detail
    description: '상세주소만 따로 적힌 동·호 (101동 202호, 301호). 제1항 제2호 같은 조문 표기는 앞의 "제"로 구분해 제외한다.'
    pattern: '(?<![제\d가-힣])\d{1,4}동\s*\d{1,4}호|(?<![제\d가-힣])\d{3,4}호(?![가-힣])'
    replacement: '[주소]'
