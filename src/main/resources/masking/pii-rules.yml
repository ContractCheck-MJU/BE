# 개인정보 마스킹 규칙 (FR-UPL-04). 외부 서비스(추론 서버·Claude)로 나가는 텍스트와 contracts.masked_text에 적용한다.
#
# 관리 방법
# - 정규식은 이 파일에서만 고친다. 코드를 바꾸거나 다시 빌드하지 않고 contractcheck.masking.rules-location 으로
#   다른 파일(예: file:/etc/contractcheck/pii-rules.yml)을 가리켜도 된다.
# - 위에서 아래로 순서대로 적용한다. 앞 규칙이 치환한 토큰에는 숫자가 없으므로 뒤 규칙과 겹치지 않는다.
#   예: 법인등록번호를 주민번호보다 먼저, 전화번호·부동산고유번호·중개등록번호·사업자번호·면허번호를 계좌번호보다 먼저 두어
#   오분류를 막는다.
# - 공백 반복이 연달아 오면 긴 공백 입력에서 매우 느려진다. 호칭·라벨 뒤의 공백은 되짚지 않는 형태(\s*+, ?+)로 쓴다.
# - 정규식은 YAML 작은따옴표('...')로 감싼다. 역슬래시를 그대로 쓸 수 있다. 작은따옴표 자체는 ''로 쓴다.
# - 잘못된 정규식·누락된 항목·겹치는 id는 앱 시작 단계에서 실패한다(마스킹이 조용히 빠지는 일을 막는다).
#
# 항목
# - id: 규칙 이름(겹치면 안 된다). 로그에 규칙별 치환 건수만 남기며 원문은 남기지 않는다.
# - description: 무엇을 가리는 규칙인지.
# - pattern: 자바 정규식. 앞 문맥은 남기고 값만 치환하려면 앞 문맥을 그룹 ( )으로 묶는다.
# - replacement: 치환 문자. 그룹은 $1처럼 참조한다.
# - verify: true면 마스킹이 끝난 텍스트에 이 패턴이 다시 보이는지 검사해, 남아 있으면 외부 전송을 막는다(실패로 처리).
#
# 스펙 미정: [이름]·[주소]는 TC-UPL-014에서 확정된 치환 문자이고, 나머지 토큰은 스펙에 "마스킹 토큰"이라고만 있어 임시다.
# 이름·주소는 정규식·규칙 기반이라 완벽하지 않다(아래 각 규칙의 한계를 본다). 번호류(주민번호·이메일·전화번호·계좌번호)는 verify로 한 번 더 막는다.

rules:
  - id: corporate-registration-number
    description: '법인 임대인·신탁사 등의 법인등록번호 (라벨 뒤 6자리-7자리 또는 13자리). 주민번호와 형태가 겹칠 수 있어 먼저 적용한다.'
    pattern: '((?:법인등록번호|법인번호)\s*+(?:[:：]\s*+)?+)\d{6}[-\s]?\d{7}(?!\d)'
    replacement: '$1[법인번호]'

  - id: resident-registration-number
    description: '주민등록번호·외국인등록번호 (생년월일 6자리 + 성별 1~8 + 6자리). 하이픈 양옆 공백과 OCR이 0을 O로 읽은 경우를 포함한다.'
    pattern: '(?<![\dOo-])[\dOo]{2}(?:[0Oo][1-9]|1[0-2Oo])(?:[0Oo][1-9]|[12][\dOo]|3[01Oo])(?:\s*[-‐–—]\s*|\s)?[1-8][\dOo]{6}(?![\dOo])'
    replacement: '[주민번호]'
    verify: true

  - id: email
    description: '임대인·임차인·중개사 이메일 주소 (전자계약·고지서 발송용 연락처)'
    pattern: '(?<![A-Za-z0-9._%+-])[A-Za-z0-9._%+-]{1,64}[ \t]{0,2}@[ \t]{0,2}[A-Za-z0-9.-]{1,128}\.[A-Za-z]{2,16}(?![A-Za-z0-9._%+-])'
    replacement: '[이메일]'
    verify: true

  - id: phone-number
    description: '휴대전화·지역번호·팩스·050X 안심번호 (010-1234-5678, 02-123-4567, 0507-1234-5678 등)'
    pattern: '(?<![\dOo-])(?:[0Oo]1[0Oo16-9]|02|050\d|0[3-6]\d|070|080)[-.\s]?[\dOo]{3,4}[-.\s]?[\dOo]{4}(?![\dOo])'
    replacement: '[전화번호]'
    verify: true

  - id: real-estate-unique-number
    description: '등기부등본 부동산 고유번호 (라벨 뒤 4-4-6자리 또는 14자리). 계좌번호 오분류를 막기 위해 먼저 적용한다.'
    pattern: '((?:부동산\s*고유번호|등기\s*고유번호|고유번호)\s*+(?:[:：]\s*+)?+)(?:\d{4}-\d{4}-\d{6}|\d{14})(?!\d)'
    replacement: '$1[부동산고유번호]'

  - id: business-registration-number
    description: '임대사업자·중개사무소 사업자등록번호 (라벨 뒤 3-2-5자리 또는 10자리). 중개등록번호·계좌번호보다 먼저 적용한다.'
    pattern: '((?:사업자등록번호|사업자번호)\s*+(?:[:：]\s*+)?+)(?:\d{3}-\d{2}-\d{5}|\d{10})(?!\d)'
    replacement: '$1[사업자번호]'

  - id: broker-registration-number
    description: '개업공인중개사 중개사무소 개설등록번호·자격번호 (예: 11440-2020-00123, 제41135-2019-00045호, 가-1234-5678)'
    pattern: '((?:(?<!사업자|법인|주민|외국인)(?:중개사무소\s*)?(?:개설)?등록번호|중개\s*등록번호|자격번호)\s*+(?:[:：]\s*+)?+)제?(?:[가-힣]{1,2}-\d{2,6}-\d{3,6}|\d{2,6}-\d{2,4}-\d{3,6})호?(?!\d)'
    replacement: '$1[중개등록번호]'

  - id: driver-license-number
    description: '신분증 확인란의 운전면허번호 (라벨 뒤 지역코드/한글-2-6-2자리)'
    pattern: '((?:운전면허번호|면허번호)\s*+(?:[:：]\s*+)?+)(?:[가-힣]{2}|\d{2})-\d{2}-\d{6}-\d{2}(?!\d)'
    replacement: '$1[면허번호]'

  - id: passport-number
    description: '외국인 임대차 계약서 등의 여권번호 (라벨 뒤 영문 1~2자 + 숫자 7~8자리)'
    pattern: '(여권번호\s*+(?:[:：]\s*+)?+)[A-Za-z]{1,2}\d{7,8}(?!\d)'
    replacement: '$1[여권번호]'

  - id: bank-account-labeled
    description: '은행·계좌 표시 뒤에 오는 숫자 (하이픈 없는 계좌번호 포함). 보증금 등 금액("원")이나 표시 없는 숫자는 건드리지 않는다.'
    pattern: '((?:계좌번호|계좌|은행|농협|신협|수협|우체국|새마을금고|뱅크|국민|신한|우리|하나|기업|IBK|KB|NH|SC|씨티|카카오|토스|케이)\s*+(?:[:：]\s*+)?+)\d{9,16}(?!\d|\s*원)'
    replacement: '$1[계좌번호]'

  - id: bank-account-spaced
    description: '은행·계좌 표시 뒤에서 공백으로 나뉜 계좌번호 (숫자 합계 10~16자리)'
    pattern: '((?:계좌번호|계좌|은행|농협|신협|수협|우체국|새마을금고|뱅크|국민|신한|우리|하나|기업|IBK|KB|NH|SC|씨티|카카오|토스|케이)\s*+(?:[:：]\s*+)?+)(?=(?:\d[ \t]?){10,16}(?![ \t]?\d))\d{2,6}(?:[ \t]\d{2,7}){1,3}(?!\d|[ \t]*원)'
    replacement: '$1[계좌번호]'

  - id: bank-account
    description: '하이픈으로 나뉜 계좌번호 (숫자 합계 10~16자리). 날짜(2026-11-24)처럼 짧은 숫자 묶음은 제외한다.'
    pattern: '(?<![\d-])(?=(?:\d-?){10,16}(?!\d))\d{2,6}(?:-\d{2,7}){2,3}(?!\d)'
    replacement: '[계좌번호]'
    verify: true

  - id: door-password
    description: '특약에 적힌 공동현관·현관·도어락 출입 비밀번호'
    pattern: '((?:공동현관|현관|출입문|도어락|도어록|출입)\s*(?:비밀번호|비번|패스워드)\s*+(?:[:：]\s*+)?+)[*#\d]{4,12}[*#]?'
    replacement: '$1[비밀번호]'

  - id: vehicle-number
    description: '주차 특약 등에 기재된 차량번호 (라벨 뒤 12가 3456, 123가4567 형식)'
    pattern: '((?:차량번호|등록차량|주차차량|차량)\s*+(?:[:：]\s*+)?+)\d{2,3}[가-힣]\s?\d{4}(?!\d)'
    replacement: '$1[차량번호]'

  - id: person-name
    description: '계약서 인적 호칭(임대인·임차인·대리인·예금주·대표자·중개인·보증인 등) 바로 뒤의 한글 이름 2~4자. 한계: 호칭 없이 쓰인 이름은 가리지 못한다.'
    pattern: '(?m)((?:공동임대인|공동임차인|임대인|임차인|대리인|개업공인중개사|소속공인중개사|공인중개사|중개보조원|중개인|계약자|예금주|대표이사|대표자|연대보증인|보증인|위임인|수임인|소유자|명의인|수취인|입금자|성[ \t]{0,3}명|이름)(?:\s*+[(（][갑을][)）])?+\s*+(?:[:：]\s*+)?+)(?!(?:소유|본인|쌍방|각자|명의|및|또는|사이|대리|양측|주소|연락처|전화|번호|계좌|은행|서명|날인|책임|의무|부담|권리|신분증|인감|도장|확인|동의|통지|합의|귀책|고의|과실|청구|통보|수선|원상|유지|반환|지급|납부|보증금|차임|월세|관리비|계약|특약|목적물|부동산|건물|주택|호실|법인|사무소|중개|이사|측|임대인|임차인|(?:(?:이다|입니다|이며|변경|별도|동일인?|새로|기존|현재|해당|이전|전원|이외|이상|이하|이내|다른|실제|개인|비상|긴급|자택|직장|회사|휴대)(?:의|은|는|이|가|된|운|인)?(?![가-힣]))))[가-힣]{2,4}(?=\s*[(（)）,，.\[/|·]|\s*씨|\s*(?:인|印|서명|날인)(?![가-힣])|\s*(?:은|는|이|가|와|과|의|에게|로부터|으로|께서)(?![가-힣])|[ \t]*$)'
    replacement: '$1[이름]'

  - id: person-name-before-field
    description: '호칭 뒤 이름에 주민번호·연락처 항목이 이어지는 경우. 콜론이 있으면 2~4자'
    pattern: '((?:공동임대인|공동임차인|임대인|임차인|대리인|개업공인중개사|소속공인중개사|공인중개사|중개보조원|중개인|계약자|예금주|대표이사|대표자|연대보증인|보증인|위임인|수임인|소유자|명의인|수취인|입금자|성[ \t]{0,3}명|이름)(?:\s*+[(（][갑을][)）])?+\s*+[:：]\s*+)(?!(?:소유|본인|쌍방|각자|명의|및|또는|사이|대리|양측|주소|연락처|전화|번호|계좌|은행|서명|날인|책임|의무|부담|권리|신분증|인감|도장|확인|동의|통지|합의|귀책|고의|과실|청구|통보|수선|원상|유지|반환|지급|납부|보증금|차임|월세|관리비|계약|특약|목적물|부동산|건물|주택|호실|법인|사무소|중개|이사|측|임대인|임차인|(?:(?:이다|입니다|이며|변경|별도|동일인?|새로|기존|현재|해당|이전|전원|이외|이상|이하|이내|다른|실제|개인|비상|긴급|자택|직장|회사|휴대)(?:의|은|는|이|가|된|운|인)?(?![가-힣]))))[가-힣]{2,4}(?=\s+(?:주민(?:등록)?번호|외국인등록번호|생년월일|연락처|전화(?:번호)?|휴대(?:전화|폰)(?:번호)?|H\.?P\.?)\s*(?:[:：]|\d|\[))'
    replacement: '$1[이름]'

  - id: person-name-before-field-no-colon
    description: '콜론 없이 항목이 이어지는 경우. 오탐을 줄이려고 흔한 성으로 시작하는 3~4자만 본다'
    pattern: '((?:공동임대인|공동임차인|임대인|임차인|대리인|개업공인중개사|소속공인중개사|공인중개사|중개보조원|중개인|계약자|예금주|대표이사|대표자|연대보증인|보증인|위임인|수임인|소유자|명의인|수취인|입금자|성[ \t]{0,3}명|이름)(?:\s*+[(（][갑을][)）])?+[ \t]+)(?!(?:소유|본인|쌍방|각자|명의|및|또는|사이|대리|양측|주소|연락처|전화|번호|계좌|은행|서명|날인|책임|의무|부담|권리|신분증|인감|도장|확인|동의|통지|합의|귀책|고의|과실|청구|통보|수선|원상|유지|반환|지급|납부|보증금|차임|월세|관리비|계약|특약|목적물|부동산|건물|주택|호실|법인|사무소|중개|이사|측|임대인|임차인|(?:(?:이다|입니다|이며|변경|별도|동일인?|새로|기존|현재|해당|이전|전원|이외|이상|이하|이내|다른|실제|개인|비상|긴급|자택|직장|회사|휴대)(?:의|은|는|이|가|된|운|인)?(?![가-힣]))))(?:남궁|황보|제갈|선우|서문|독고|[김이박최정강조윤장임한오서신권황안송류유전홍고문양손배백허노남심하곽성차주우구민나진지엄채원천방공현함변염여추도소석설마길연위표명기반왕금옥육인맹제모탁국어은편용경봉사부])[가-힣]{2}(?=\s+(?:주민(?:등록)?번호|외국인등록번호|생년월일|연락처|전화(?:번호)?|휴대(?:전화|폰)(?:번호)?|H\.?P\.?)\s*+(?:[:：]\s*+)?+(?:\d|\[))'
    replacement: '$1[이름]'

  - id: person-name-table
    description: '표(| 호칭 | 이름 |)에 적힌 이름. 흔한 성으로 시작하고 다음 칸에 번호가 있을 때만 본다'
    pattern: '((?:공동임대인|공동임차인|임대인|임차인|대리인|개업공인중개사|소속공인중개사|공인중개사|중개보조원|중개인|계약자|예금주|대표이사|대표자|연대보증인|보증인|위임인|수임인|소유자|명의인|수취인|입금자|성[ \t]{0,3}명|이름)[ \t]*\|[ \t]*)(?!(?:소유|본인|쌍방|각자|명의|및|또는|사이|대리|양측|주소|연락처|전화|번호|계좌|은행|서명|날인|책임|의무|부담|권리|신분증|인감|도장|확인|동의|통지|합의|귀책|고의|과실|청구|통보|수선|원상|유지|반환|지급|납부|보증금|차임|월세|관리비|계약|특약|목적물|부동산|건물|주택|호실|법인|사무소|중개|이사|측|임대인|임차인|(?:(?:이다|입니다|이며|변경|별도|동일인?|새로|기존|현재|해당|이전|전원|이외|이상|이하|이내|다른|실제|개인|비상|긴급|자택|직장|회사|휴대)(?:의|은|는|이|가|된|운|인)?(?![가-힣]))))(?:남궁|황보|제갈|선우|서문|독고|[김이박최정강조윤장임한오서신권황안송류유전홍고문양손배백허노남심하곽성차주우구민나진지엄채원천방공현함변염여추도소석설마길연위표명기반왕금옥육인맹제모탁국어은편용경봉사부])[가-힣]{1,3}(?=[ \t]*\|[ \t]*(?:\[|\d))'
    replacement: '$1[이름]'

  - id: person-name-table-labeled
    description: '표의 성명·이름 칸 바로 옆에 적힌 이름. 흔한 성으로 시작하는 것만 본다'
    pattern: '((?:성[ \t]{0,3}명|이름)[ \t]*\|[ \t]*)(?!(?:소유|본인|쌍방|각자|명의|및|또는|사이|대리|양측|주소|연락처|전화|번호|계좌|은행|서명|날인|책임|의무|부담|권리|신분증|인감|도장|확인|동의|통지|합의|귀책|고의|과실|청구|통보|수선|원상|유지|반환|지급|납부|보증금|차임|월세|관리비|계약|특약|목적물|부동산|건물|주택|호실|법인|사무소|중개|이사|측|임대인|임차인|(?:(?:이다|입니다|이며|변경|별도|동일인?|새로|기존|현재|해당|이전|전원|이외|이상|이하|이내|다른|실제|개인|비상|긴급|자택|직장|회사|휴대)(?:의|은|는|이|가|된|운|인)?(?![가-힣]))))(?:남궁|황보|제갈|선우|서문|독고|[김이박최정강조윤장임한오서신권황안송류유전홍고문양손배백허노남심하곽성차주우구민나진지엄채원천방공현함변염여추도소석설마길연위표명기반왕금옥육인맹제모탁국어은편용경봉사부])[가-힣]{1,3}(?=[ \t]*\|)'
    replacement: '$1[이름]'

  - id: person-name-spaced
    description: '글자를 띄어 쓴 이름 뒤에 (인)·(서명) 표시가 있는 경우'
    pattern: '((?:공동임대인|공동임차인|임대인|임차인|대리인|개업공인중개사|소속공인중개사|공인중개사|중개보조원|중개인|계약자|예금주|대표이사|대표자|연대보증인|보증인|위임인|수임인|소유자|명의인|수취인|입금자|성[ \t]{0,3}명|이름)(?:\s*+[(（][갑을][)）])?+\s*+(?:[:：][ \t]*+)?+)(?:남궁|황보|제갈|선우|서문|독고|[김이박최정강조윤장임한오서신권황안송류유전홍고문양손배백허노남심하곽성차주우구민나진지엄채원천방공현함변염여추도소석설마길연위표명기반왕금옥육인맹제모탁국어은편용경봉사부])(?:[ \t]++[가-힣]){1,3}(?=\s*(?:[(（]\s*(?:인|서명)\s*[)）]|印))'
    replacement: '$1[이름]'

  - id: person-name-holder
    description: '예금주는 OOO이다 형태의 문장에 적힌 이름'
    pattern: '((?:예금주|명의인|수취인)(?:은|는)[ \t]+)(?!(?:소유|본인|쌍방|각자|명의|및|또는|사이|대리|양측|주소|연락처|전화|번호|계좌|은행|서명|날인|책임|의무|부담|권리|신분증|인감|도장|확인|동의|통지|합의|귀책|고의|과실|청구|통보|수선|원상|유지|반환|지급|납부|보증금|차임|월세|관리비|계약|특약|목적물|부동산|건물|주택|호실|법인|사무소|중개|이사|측|임대인|임차인|(?:(?:이다|입니다|이며|변경|별도|동일인?|새로|기존|현재|해당|이전|전원|이외|이상|이하|이내|다른|실제|개인|비상|긴급|자택|직장|회사|휴대)(?:의|은|는|이|가|된|운|인)?(?![가-힣]))))(?:남궁|황보|제갈|선우|서문|독고|[김이박최정강조윤장임한오서신권황안송류유전홍고문양손배백허노남심하곽성차주우구민나진지엄채원천방공현함변염여추도소석설마길연위표명기반왕금옥육인맹제모탁국어은편용경봉사부])[가-힣]{1,3}(?=이다|입니다|이며|임(?![가-힣]))'
    replacement: '$1[이름]'

  - id: person-name-relation
    description: '배우자·세대주 뒤의 이름. 오탐을 줄이려고 성을 포함한 3자(복성은 3~4자)만 본다'
    pattern: '((?:배우자|세대주)[ \t]*[:：]?[ \t]+)(?!(?:소유|본인|쌍방|각자|명의|및|또는|사이|대리|양측|주소|연락처|전화|번호|계좌|은행|서명|날인|책임|의무|부담|권리|신분증|인감|도장|확인|동의|통지|합의|귀책|고의|과실|청구|통보|수선|원상|유지|반환|지급|납부|보증금|차임|월세|관리비|계약|특약|목적물|부동산|건물|주택|호실|법인|사무소|중개|이사|측|임대인|임차인|(?:(?:이다|입니다|이며|변경|별도|동일인?|새로|기존|현재|해당|이전|전원|이외|이상|이하|이내|다른|실제|개인|비상|긴급|자택|직장|회사|휴대)(?:의|은|는|이|가|된|운|인)?(?![가-힣]))))(?:(?:남궁|황보|제갈|선우|서문|독고)[가-힣]{1,2}|(?:남궁|황보|제갈|선우|서문|독고|[김이박최정강조윤장임한오서신권황안송류유전홍고문양손배백허노남심하곽성차주우구민나진지엄채원천방공현함변염여추도소석설마길연위표명기반왕금옥육인맹제모탁국어은편용경봉사부])[가-힣]{2})(?=\s*(?:씨|[(（,.]|에게|은|는|이|가|와|과|의|$))'
    replacement: '$1[이름]'

  - id: person-name-english
    description: '외국인 임대차 계약서에서 호칭 뒤에 적힌 영문 성명 (2~3단어)'
    pattern: '(?m)((?:임대인|임차인|대리인|계약자|예금주|성명|이름)(?:\s*+[(（][갑을][)）])?+\s*+[:：]\s*+)[A-Za-z]{2,20}(?:\s+[A-Za-z]{2,20}){1,2}(?=\s*[(（)）,，.\[/|]|(?:\s*$))'
    replacement: '$1[이름]'

  - id: postal-code
    description: '우편번호 라벨 뒤의 5자리 숫자'
    pattern: '(우편번호\s*+(?:[:：]\s*+)?+)\d{5}(?!\d)'
    replacement: '$1[우편번호]'

  - id: property-address-road
    description: '소재지·임대목적물·물건지 라벨 뒤의 도로명 주소는 시·도 + 시·군·구까지만 남기고 상세(읍/면/로/길/번호/건물명/동/호/층)를 가린다.'
    pattern: '((?:소재지(?:는)?|임대\s*목적물|목적물의\s*표시|물건지)[ \t]*+(?:[:：][ \t]*+)?+(?:\r?\n[ \t]*+)?+(?:서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)(?:특별시|광역시|특별자치시|특별자치도|도|시)?(?:[ \t]+[가-힣0-9]+(?:시|군|구)(?:[ \t]+[가-힣0-9]+구)?)?[ \t]+)(?:[가-힣0-9]+(?:읍|면)[ \t]+)?[가-힣0-9]+(?:로|길)(?:[ \t]*\d+번길)?[ \t]*\d+(?:-\d+)?(?:\s*\([가-힣0-9]+(?:동|리|가)\))?(?:[ \t]*,?[ \t]*(?:[가-힣A-Za-z0-9]{1,20}(?:아파트|빌라|오피스텔|원룸|하우스|타워|빌딩|맨션|레지던스|주택|하이츠|팰리스)[ \t]+)?(?:지하[ \t]*\d+층[ \t]+|\d+층[ \t]+)?(?:(?:[A-Za-z가-힣]|\d{1,4})동[ \t]+)?(?:[Bb]?\d{1,4}(?:-\d{1,3})?호))?(?:[ \t]*(?:지하[ \t]*)?\d+층)?'
    replacement: '$1[주소]'

  - id: property-address-lot
    description: '소재지·임대목적물·물건지 라벨 뒤의 지번 주소는 시·도 + 시·군·구까지만 남기고 상세(읍/면/동/리/번지/건물명/동/호/층)를 가린다.'
    pattern: '((?:소재지(?:는)?|임대\s*목적물|목적물의\s*표시|물건지)[ \t]*+(?:[:：][ \t]*+)?+(?:\r?\n[ \t]*+)?+(?:서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)(?:특별시|광역시|특별자치시|특별자치도|도|시)?(?:[ \t]+[가-힣0-9]+(?:시|군|구)(?:[ \t]+[가-힣0-9]+구)?)?[ \t]+)(?:[가-힣0-9]+(?:읍|면)[ \t]+)?[가-힣0-9]+(?:동|리|가)[ \t]*산?\d+(?:-\d+)?(?:번지)?(?:[ \t]*,?[ \t]*(?:[가-힣A-Za-z0-9]{1,20}(?:아파트|빌라|오피스텔|원룸|하우스|타워|빌딩|맨션|레지던스|주택|하이츠|팰리스)[ \t]+)?(?:지하[ \t]*\d+층[ \t]+|\d+층[ \t]+)?(?:(?:[A-Za-z가-힣]|\d{1,4})동[ \t]+)?(?:[Bb]?\d{1,4}(?:-\d{1,3})?호))?(?:[ \t]*(?:지하[ \t]*)?\d+층)?'
    replacement: '$1[주소]'

  - id: property-address-district
    description: '소재지·임대목적물·물건지 라벨 뒤에 시·도를 생략하고 시·군·구로 시작하는 주소는 시·군·구까지만 남기고 상세를 가린다.'
    pattern: '((?:소재지(?:는)?|임대\s*목적물|목적물의\s*표시|물건지)[ \t]*[:：][ \t]*[가-힣0-9]+(?:시|군|구)(?:[ \t]+[가-힣0-9]+구)?[ \t]+)(?:[가-힣0-9]+(?:읍|면)[ \t]+)?[가-힣0-9]+(?:로|길|동|리|가)(?:[ \t]*\d+번길)?[ \t]*산?\d+(?:-\d+)?(?:번지)?(?:\s*\([가-힣0-9]+(?:동|리|가)\))?(?:[ \t]*,?[ \t]*(?:[가-힣A-Za-z0-9]{1,20}(?:아파트|빌라|오피스텔|원룸|하우스|타워|빌딩|맨션|레지던스|주택|하이츠|팰리스)[ \t]+)?(?:지하[ \t]*\d+층[ \t]+|\d+층[ \t]+)?(?:(?:[A-Za-z가-힣]|\d{1,4})동[ \t]+)?(?:[Bb]?\d{1,4}(?:-\d{1,3})?호))?(?:[ \t]*(?:지하[ \t]*)?\d+층)?'
    replacement: '$1[주소]'

  - id: address
    description: '당사자 주소·라벨 없는 도로명 주소 전체 마스킹 (fail-safe). 한계: 시·도와 라벨이 모두 없는 주소는 가리지 못한다.'
    pattern: '(?:서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)(?:특별시|광역시|특별자치시|특별자치도|도|시)?\s*[가-힣0-9]+(?:시|군|구)(?:\s*[가-힣0-9]+(?:구|읍|면))?\s*[가-힣0-9]+(?:로|길)(?:\s*\d+번길)?\s*\d+(?:-\d+)?(?:\s*\([가-힣0-9]+(?:동|리|가)\))?(?:\s*,?\s*(?:[가-힣A-Za-z0-9]{1,20}(?:아파트|빌라|오피스텔|원룸|하우스|타워|빌딩|맨션|레지던스|주택|하이츠|팰리스)\s*)?(?:지하\s*\d+층\s*|\d+층\s*)?(?:(?:[A-Za-z가-힣]|\d{1,4})동\s*)?(?:[Bb]?\d{1,4}(?:-\d{1,3})?호))?(?:\s*(?:지하\s*)?\d+층)?'
    replacement: '[주소]'

  - id: address-lot
    description: '당사자 주소·라벨 없는 지번 주소 전체 마스킹 (fail-safe)'
    pattern: '(?:서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)(?:특별시|광역시|특별자치시|특별자치도|도|시)?\s*[가-힣0-9]+(?:시|군|구)(?:\s*[가-힣0-9]+(?:구|읍|면))?\s*[가-힣0-9]+(?:동|리|가)\s*산?\d+(?:-\d+)?(?:번지)?(?:\s*,?\s*(?:[가-힣A-Za-z0-9]{1,20}(?:아파트|빌라|오피스텔|원룸|하우스|타워|빌딩|맨션|레지던스|주택|하이츠|팰리스)\s*)?(?:지하\s*\d+층\s*|\d+층\s*)?(?:(?:[A-Za-z가-힣]|\d{1,4})동\s*)?(?:[Bb]?\d{1,4}(?:-\d{1,3})?호))?(?:\s*(?:지하\s*)?\d+층)?'
    replacement: '[주소]'

  - id: address-party-labeled
    description: '당사자 주소·거주지 라벨 뒤에 시·도를 생략하고 시·군·구로 시작하는 주소 전체 마스킹 (fail-safe)'
    pattern: '((?:주소|거주지)[ \t]*[:：][ \t]*)[가-힣0-9]+(?:시|군|구)(?:[ \t]+[가-힣0-9]+(?:구|읍|면))?[ \t]+[가-힣0-9]+(?:로|길|동|리|가)(?:[ \t]*\d+번길)?[ \t]*산?\d+(?:-\d+)?(?:번지)?(?:\s*\([가-힣0-9]+(?:동|리|가)\))?(?:[ \t]*,?[ \t]*(?:지하[ \t]*\d+층[ \t]+|\d+층[ \t]+)?(?:(?:[A-Za-z가-힣]|\d{1,4})동[ \t]+)?(?:[Bb]?\d{1,4}(?:-\d{1,3})?호))?(?:[ \t]*(?:지하[ \t]*)?\d+층)?'
    replacement: '$1[주소]'

  - id: address-district-unit
    description: '라벨과 시·도가 없어도 시·군·구 + 도로명 + 번호 뒤에 층·호가 있으면 주소 전체를 가린다'
    pattern: '(?<![가-힣])[가-힣]{1,4}(?:시|군|구)[ \t]+[가-힣0-9]+(?:로|길)(?:[ \t]*\d+번길)?[ \t]*\d+(?:-\d+)?[ \t]*,?[ \t]*(?:(?:[A-Za-z]|\d{1,4})동[ \t]*)?(?:(?:지하[ \t]*)?\d{1,2}층(?:[ \t]*[Bb]?\d{1,4}호)?|[Bb]?\d{1,4}(?:-\d{1,3})?호)'
    replacement: '[주소]'

  - id: address-lot-unlabeled
    description: '시·도가 없어도 동·리·가 + 지번 + 번지 형태는 주소로 본다'
    pattern: '(?<![가-힣])[가-힣]{1,6}(?:동|리|가)[ \t]*산?\d+(?:-\d+)?번지'
    replacement: '[주소]'

  - id: address-detail
    description: '상세주소만 따로 적힌 동·호·지하호실 (101동 202호, A동 201호, B101호, 지하101호, 301호, 201-1호). 제1항 제2호 같은 조문 표기는 제외한다.'
    pattern: '(?<![제\d가-힣])(?:[A-Za-z가-힣]|\d{1,4})동\s*[Bb]?\d{1,4}(?:-\d{1,3})?호|(?<![제\d가-힣])(?:지하\s*\d{1,4}|[Bb]\d{2,4}|\d{3,4}(?:-\d{1,3})?)호(?![가-힣])'
    replacement: '[주소]'
