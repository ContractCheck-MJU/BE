# dev: application.yml 의 PostgreSQL(DB_URL, DB_USERNAME, DB_PASSWORD)을 그대로 쓴다.
# 파일·ECS JSON·Tomcat 액세스 로그는 application.yml 의 dev|prod 문서를 쓴다.
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: info
    ac.mju.contractcheck: info
    org.springframework: warn
    org.springframework.boot: info
    org.hibernate: warn
    org.apache.catalina: warn
    org.apache.tomcat: warn
    org.apache.coyote: warn
    com.zaxxer.hikari: warn
    org.springdoc: warn

# Swagger UI가 XSRF-TOKEN 쿠키를 읽어 X-XSRF-TOKEN 헤더로 보내게 한다
springdoc:
  swagger-ui:
    csrf:
      enabled: true
