name: CD

# main CI가 성공하면 이미지를 빌드해 GHCR(ghcr.io/contractcheck-mju/be)에 올리고,
# Coolify 배포 웹훅을 호출해 서버가 :main 이미지를 받아 다시 띄우게 한다.
# 저장소 시크릿 COOLIFY_WEBHOOK(Deploy Webhook URL), COOLIFY_TOKEN(Coolify API 토큰)이 필요하다.
# 서버·Coolify 설정은 docs/deploy.md를 본다. pull_request에서는 실행하지 않는다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/contractcheck-mju/be

jobs:
  image:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve commit and tags
        id: meta
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="${RUN_SHA:-$GITHUB_SHA}"
          tags="$IMAGE:latest,$IMAGE:main,$IMAGE:sha-${sha:0:7}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_WEBHOOK 또는 COOLIFY_TOKEN 시크릿이 없습니다. docs/deploy.md를 보세요."
            exit 1
          fi
          # 웹훅은 배포를 큐에 넣고 바로 응답한다. 실제 배포 결과는 Coolify 화면에서 확인한다.
          # deploy 엔드포인트는 POST만 받는다(GET이면 405, Coolify 4.7.5에서 확인).
          curl -X POST --fail-with-body -sS --retry 3 --retry-delay 5 --max-time 30 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"
